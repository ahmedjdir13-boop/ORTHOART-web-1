  <circle cx="258" cy="150" r="4.5" fill="#5f4434"/>
  <path d="M216 168 C228 180, 252 180, 264 168" stroke="#5f4434" stroke-width="4" stroke-linecap="round" fill="none"/>

  <!-- small retainer wire across the smile -->
