  </defs>
  <rect width="480" height="360" fill="url(#bgG3)"/>

  <!-- friendly tooth shape, reusing the brand tooth silhouette, scaled up -->
  <g transform="translate(140,60) scale(2)">
    <path d="M50 12 C32 12 20 24 20 39 C20 48 23 54 26 61 C29 68 31 82 38 82 C44 82 44 66 50 66 C56 66 56 82 62 82 C69 82 71 68 74 61 C77 54 80 48 80 39 C80 24 68 12 50 12 Z"
          fill="#f4e7cd"/>
