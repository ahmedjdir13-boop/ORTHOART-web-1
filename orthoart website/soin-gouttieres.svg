<svg viewBox="0 0 480 360" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgG1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6d5138"/>
      <stop offset="100%" stop-color="#3d2c1f"/>
    </linearGradient>
    <linearGradient id="trayG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fdf4de" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#fdf4de" stop-opacity="0.25"/>
    </linearGradient>
  </defs>
  <rect width="480" height="360" fill="url(#bgG1)"/>

  <!-- arch of teeth -->
  <g fill="#f4e7cd" opacity="0.9">
    <rect x="120" y="150" width="30" height="46" rx="10"/>
    <rect x="156" y="140" width="30" height="56" rx="10"/>
    <rect x="192" y="134" width="30" height="62" rx="10"/>
    <rect x="228" y="132" width="30" height="64" rx="10"/>
    <rect x="264" y="134" width="30" height="62" rx="10"/>
    <rect x="300" y="140" width="30" height="56" rx="10"/>
    <rect x="336" y="150" width="30" height="46" rx="10"/>
  </g>

  <!-- clear aligner tray outline, offset slightly to read as "transparent overlay" -->
  <path d="M108 158
           C108 118, 150 96, 240 96
           C330 96, 372 118, 372 158
           L372 206
           C330 226, 288 234, 240 234
           C192 234, 150 226, 108 206
           Z"
        fill="url(#trayG)" stroke="#f2d7ac" stroke-width="2.5"/>

  <!-- soft highlight sweep -->
  <path d="M140 116 C190 100, 290 100, 340 116" stroke="#fff7e9" stroke-width="2" stroke-linecap="round" opacity="0.55" fill="none"/>
</svg>
